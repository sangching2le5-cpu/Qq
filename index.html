<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 13 – Global Problems | Flashcards</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{

  .chip:hover{background:rgba(255,255,255,.11); color:#fff}

    background:linear-gradient(135deg,#3b82f6,#8b5cf6);

  }

  .seg{display:flex; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.13);
       border-radius:999px; padding:3px; gap:3px}

    font-family:inherit; font-size:13px; cursor:pointer; border:0; border-radius:999px;
    padding:7px 14px; background:transparent; color:#a9b6d3; transition:.2s;
  }
  .seg button.active{background:rgba(255,255,255,.14); color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.3)}

  .ghost{
    font-family:inherit; font-size:13px; cursor:pointer; padding:8px 15px; border-radius:999px;

  .switch{display:flex; align-items:center; gap:8px; font-size:13px; color:#a9b6d3;
          padding:8px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.14);
          background:rgba(255,255,255,.05); cursor:pointer; user-select:none}
  .switch input{accent-color:#8b5cf6; cursor:pointer}

  /* ---- Card ---- */
  .scene{width:100%; max-width:660px; perspective:1600px}
  .card{position:relative; width:100%; height:clamp(370px,54vh,440px); cursor:pointer}
  .card-inner{position:absolute; inset:0; transform-style:preserve-3d;
              transition:transform .65s cubic-bezier(.22,.8,.3,1)}
  .card.flipped .card-inner{transform:rotateY(180deg)}
  .card-face{
    position:absolute; inset:0; overflow:auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:26px 22px; text-align:center;
    border-radius:26px; border:1px solid rgba(255,255,255,.13);
    background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.028));
    box-shadow:0 26px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
  }
  .card-back{transform:rotateY(180deg)}

  .badge{
    font-size:11px; letter-spacing:.7px; text-transform:uppercase; font-weight:600;
    color:#9fb3d9; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
    padding:4px 12px; border-radius:999px;
  }
  .word{font-size:clamp(28px,6.4vw,46px); font-weight:700; letter-spacing:-1px; line-height:1.1}
  .word-sm{font-size:19px; font-weight:600; color:#c3d0e9}
  .meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center}
  .pos{font-size:12px; font-style:italic; color:#8fa1c4; background:rgba(255,255,255,.07);
       padding:2px 9px; border-radius:7px}
  .ipa{font-family:"SF Mono",Consolas,monospace; font-size:15px; color:#67e8f9}
  .meaning{font-size:clamp(20px,4.4vw,26px); font-weight:600; color:#fde68a; line-height:1.35}
  .example{font-size:15px; color:#c3cfe6; font-style:italic; line-height:1.6; max-width:520px}

  .speak-row{display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-top:4px}
  .speak{
    font-family:inherit; font-size:13px; cursor:pointer; padding:9px 16px; border-radius:999px;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.07); color:#dbe4f7;
    transition:.18s;
  }
  .speak:hover{background:rgba(255,255,255,.16); transform:translateY(-1px)}
  .speak:active{transform:scale(.96)}

  .speak.playing{background:rgba(103,232,249,.28); color:#fff}

  .flip-hint{position:absolute; bottom:14px; left:0; right:0; font-size:11.5px; color:#7f8dad; letter-spacing:.3px}

  /* ---- Progress & controls ---- */
  .progress{width:100%; max-width:660px; display:flex; align-items:center; gap:14px}
  .bar{flex:1; height:7px; border-radius:999px; background:rgba(255,255,255,.09); overflow:hidden}
  .fill{height:100%; width:0; border-radius:999px;
        background:linear-gradient(90deg,#38bdf8,#a78bfa); transition:width .3s ease}
  .counter{font-size:13px; color:#93a0bd; font-variant-numeric:tabular-nums; min-width:64px; text-align:right}

  .controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .nav{
    font-family:inherit; font-size:14px; cursor:pointer; padding:12px 24px; border-radius:14px;
    border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:#dbe4f7; transition:.2s;
  }
  .nav:hover{background:rgba(255,255,255,.14); transform:translateY(-1px)}

  .hint{font-size:12.5px; color:#76839f; text-align:center; margin:2px 0 0; line-height:1.9}
  kbd{
    font-family:inherit; font-size:11.5px; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.16); border-bottom-width:2px;

  }

  @media (max-width:520px){
    .card-face{padding:22px 16px; gap:11px}
    .nav{padding:11px 16px; font-size:13px}

    .flip-hint{bottom:10px}

</style>

<body>

<header>
  <h1>Unit 13 · Global Problems</h1>
  <p>Flashcards phát âm chuẩn Anh–Mỹ 🇺🇸 &amp; Anh–Anh 🇬🇧</p>
</header>

<div class="wrap" id="chips"></div>

<div class="wrap">
  <div class="seg" id="accentSeg">
    <button data-accent="en-US" class="active">🇺🇸 Anh–Mỹ</button>
    <button data-accent="en-GB">🇬🇧 Anh–Anh</button>

</div>

<div class="progress">

  <div class="counter" id="counter">1 / 1</div>
</div>

<div class="controls">
  <button class="nav" id="prevBtn">← Trước</button>
  <button class="nav primary" id="flipBtn">Lật thẻ</button>
  <button class="nav" id="nextBtn">Sau →</button>
</div>

<p class="hint">
  Phím tắt: <kbd>Space</kbd> lật thẻ · <kbd>←</kbd> <kbd>→</kbd> chuyển thẻ · <kbd>1</kbd> nghe US · <kbd>2</kbd> nghe UK
</p>
<p class="note" id="voiceNote"></p>

<script>
/* =========================================================
   1. DỮ LIỆU TỪ VỰNG – Unit 13 Global Problems
   ========================================================= */
const CATS = {

const DATA = [
  /* ---------- A. Disasters and tragedies ---------- */
  {w:'earthquake', p:'n', ipa:'/ˈɜːθkweɪk/', vi:'động đất', ex:'A big earthquake shook the city at noon today.', c:'disaster'},
  {w:'flood', p:'n', ipa:'/flʌd/', vi:'lũ lụt', ex:'The flood damaged many houses.', c:'disaster'},
  {w:'drought', p:'n', ipa:'/draʊt/', vi:'hạn hán', ex:'The area is suffering its worst drought for many years.', c:'disaster'},
  {w:'volcano', p:'n', ipa:'/vɒlˈkeɪnəʊ/', vi:'núi lửa', ex:'A volcano has erupted in Indonesia.', c:'disaster'},
  {w:'lava', p:'n', ipa:'/ˈlɑːvə/', vi:'dung nham', ex:'The lava flow destroyed three villages.', c:'disaster'},
  {w:'famine', p:'n', ipa:'/ˈfæmɪn/', vi:'nạn đói', ex:'Millions are starving as a result of the famine.', c:'disaster'},
  {w:'landslide', p:'n', ipa:'/ˈlændslaɪd/', vi:'sạt lở đất', ex:'The landslide blocked the mountain road.', c:'disaster'},
  {w:'epidemic', p:'n', ipa:'/ˌepɪˈdemɪk/', vi:'dịch bệnh', ex:'The flu epidemic spread rapidly throughout the country.', c:'disaster'},
  {w:'explosion', p:'n', ipa:'/ɪkˈspləʊʒən/', vi:'vụ nổ', ex:'The explosion resulted in 300 casualties.', c:'disaster'},
  {w:'major accident', p:'n phr', ipa:'/ˌmeɪdʒər ˈæksɪdənt/', vi:'tai nạn nghiêm trọng', ex:'The major accident injured many people.', c:'disaster'},
  {w:'incident', p:'n', ipa:'/ˈɪnsɪdənt/', vi:'sự cố, vụ việc', ex:'The incident caused widespread concern.', c:'disaster'},
  {w:'plane crash', p:'n phr', ipa:'/ˈpleɪn kræʃ/', vi:'vụ rơi máy bay', ex:'The plane crash shocked the whole country.', c:'disaster'},
  {w:'hurricane', p:'n', ipa:'/ˈhʌrɪkən/', vi:'bão cuồng phong', ex:'The hurricane destroyed several coastal villages.', c:'disaster'},
  {w:'tornado', p:'n', ipa:'/tɔːˈneɪdəʊ/', vi:'lốc xoáy', ex:'A tornado swept through the islands yesterday.', c:'disaster'},
  {w:'typhoon', p:'n', ipa:'/taɪˈfuːn/', vi:'bão nhiệt đới (Tây Bắc Thái Bình Dương)', ex:'The typhoon damaged many buildings.', c:'disaster'},
  {w:'tropical storm', p:'n phr', ipa:'/ˌtrɒpɪkəl ˈstɔːm/', vi:'bão nhiệt đới', ex:'The tropical storm is approaching the coast.', c:'disaster'},
  {w:'war', p:'n', ipa:'/wɔː(r)/', vi:'chiến tranh', ex:'Many families lost their homes during the war.', c:'disaster'},
  {w:'civil war', p:'n phr', ipa:'/ˌsɪvəl ˈwɔː(r)/', vi:'nội chiến', ex:'Civil war has broken out in the north of the country.', c:'disaster'},
  {w:'natural disaster', p:'n phr', ipa:'/ˌnætʃrəl dɪˈzɑːstə(r)/', vi:'thảm họa thiên nhiên', ex:'Earthquakes and floods are natural disasters.', c:'disaster'},
  {w:'aftershock', p:'n', ipa:'/ˈɑːftəʃɒk/', vi:'dư chấn', ex:'The aftershock struck at 3.35 pm local time.', c:'disaster'},
  {w:'gunfire', p:'n', ipa:'/ˈɡʌnfaɪə(r)/', vi:'tiếng súng', ex:'Gunfire could be heard all over the town.', c:'disaster'},
  {w:'fireball', p:'n', ipa:'/ˈfaɪəbɔːl/', vi:'quả cầu lửa', ex:'Witnesses saw a fireball fall out of the sky.', c:'disaster'},

  /* ---------- B. Language help and related verbs ---------- */
  {w:'injure', p:'v', ipa:'/ˈɪndʒə(r)/', vi:'làm bị thương', ex:'The accident injured three people.', c:'verb'},
  {w:'injury', p:'n', ipa:'/ˈɪndʒəri/', vi:'thương tích', ex:'He suffered a serious injury.', c:'verb'},
  {w:'damage', p:'v / n', ipa:'/ˈdæmɪdʒ/', vi:'làm hư hại; thiệt hại', ex:'The storm damaged several buildings.', c:'verb'},
  {w:'erupt', p:'v', ipa:'/ɪˈrʌpt/', vi:'phun trào', ex:'The volcano erupted suddenly.', c:'verb'},
  {w:'fear someone dead', p:'v phr', ipa:'/fɪə(r) ˈsʌmwʌn ded/', vi:'lo ngại ai đó đã thiệt mạng', ex:'Hundreds are feared dead.', c:'verb'},
  {w:'spread', p:'v', ipa:'/spred/', vi:'lan rộng', ex:'The disease spread rapidly.', c:'verb'},
  {w:'starve', p:'v', ipa:'/stɑːv/', vi:'chết đói, chịu đói', ex:'Many people are starving.', c:'verb'},
  {w:'shake', p:'v', ipa:'/ʃeɪk/', vi:'làm rung chuyển', ex:'The earthquake shook the city.', c:'verb'},
  {w:'suffer', p:'v', ipa:'/ˈsʌfə(r)/', vi:'chịu đựng, trải qua', ex:'The region suffered severe damage.', c:'verb'},
  {w:'break out', p:'phr v', ipa:'/ˌbreɪk ˈaʊt/', vi:'bùng phát, bùng nổ', ex:'Civil war has broken out.', c:'verb'},
  {w:'sweep through', p:'phr v', ipa:'/ˌswiːp ˈθruː/', vi:'quét qua', ex:'A tornado swept through the town.', c:'verb'},
  {w:'explode', p:'v', ipa:'/ɪkˈspləʊd/', vi:'phát nổ', ex:'The bomb exploded.', c:'verb'},
  {w:'clear', p:'v', ipa:'/klɪə(r)/', vi:'dọn thông, làm sạch', ex:'Workers cleared the road after the landslide.', c:'verb'},
  {w:'recede', p:'v', ipa:'/rɪˈsiːd/', vi:'rút đi, giảm xuống', ex:'The floodwater began to recede.', c:'verb'},
  {w:'defuse', p:'v', ipa:'/ˌdiːˈfjuːz/', vi:'vô hiệu hóa bom', ex:'Police defused the terrorist bomb.', c:'verb'},
  {w:'heed', p:'v', ipa:'/hiːd/', vi:'chú ý và làm theo', ex:'People did not heed the flood warnings.', c:'verb'},

  /* ---------- C. People involved in disasters ---------- */
  {w:'casualty', p:'n', ipa:'/ˈkæʒuəlti/', vi:'người chết hoặc bị thương (trong tai nạn, chiến tranh, thảm họa)', ex:'The explosion resulted in 300 casualties.', c:'people'},
  {w:'victim', p:'n', ipa:'/ˈvɪktɪm/', vi:'nạn nhân, người chịu hậu quả', ex:'Children are the real victims of civil war.', c:'people'},
  {w:'survivor', p:'n', ipa:'/səˈvaɪvə(r)/', vi:'người sống sót', ex:'There were only three survivors.', c:'people'},
  {w:'survival', p:'n', ipa:'/səˈvaɪvəl/', vi:'sự sống sót', ex:'Survival was difficult after the disaster.', c:'people'},
  {w:'refugee', p:'n', ipa:'/ˌrefjuˈdʒiː/', vi:'người tị nạn', ex:'Thousands of refugees crossed the border.', c:'people'},
  {w:'migrant', p:'n', ipa:'/ˈmaɪɡrənt/', vi:'người di cư', ex:'Millions of migrants enter the country each year.', c:'people'},
  {w:'economic migrant', p:'n phr', ipa:'/ˌiːkəˈnɒmɪk ˈmaɪɡrənt/', vi:'người di cư vì lý do kinh tế', ex:'Economic migrants often move abroad to find work.', c:'people'},
  {w:'the dead', p:'n phr', ipa:'/ðə ded/', vi:'những người đã chết', ex:'The dead were flown out in helicopters.', c:'people'},
  {w:'the wounded', p:'n phr', ipa:'/ðə ˈwuːndɪd/', vi:'những người bị thương', ex:'The wounded received medical treatment.', c:'people'},
  {w:'wounded', p:'adj', ipa:'/ˈwuːndɪd/', vi:'bị thương (trong chiến đấu / do vũ khí)', ex:'The wounded soldiers were taken to hospital.', c:'people'},
  {w:'shelter', p:'n', ipa:'/ˈʃeltə(r)/', vi:'nơi trú ẩn', ex:'The refugees were looking for food and shelter.', c:'people'},
  {w:'border', p:'n', ipa:'/ˈbɔːdə(r)/', vi:'biên giới', ex:'Thousands crossed the border.', c:'people'},
  {w:'battlefield', p:'n', ipa:'/ˈbætlfiːld/', vi:'chiến trường', ex:'The dead and wounded were left on the battlefield.', c:'people'},

  /* ---------- D. Diseases and epidemics ---------- */
  {w:'disease', p:'n', ipa:'/dɪˈziːz/', vi:'bệnh tật', ex:'The disease affects many people.', c:'disease'},
  {w:'rabies', p:'n', ipa:'/ˈreɪbiːz/', vi:'bệnh dại', ex:'Rabies can be transmitted by an infected animal bite.', c:'disease'},
  {w:'AIDS', p:'n', ipa:'/eɪdz/', vi:'hội chứng suy giảm miễn dịch mắc phải', ex:'AIDS affects the immune system.', c:'disease'},
  {w:'HIV', p:'n', ipa:'/ˌeɪtʃ aɪ ˈviː/', vi:'vi-rút gây suy giảm miễn dịch ở người', ex:'HIV attacks the immune system.', c:'disease'},
  {w:'malaria', p:'n', ipa:'/məˈleəriə/', vi:'bệnh sốt rét', ex:'Malaria is transmitted by infected mosquitoes.', c:'disease'},
  {w:'cholera', p:'n', ipa:'/ˈkɒlərə/', vi:'bệnh tả', ex:'Cholera can spread through contaminated water.', c:'disease'},
  {w:'typhoid', p:'n', ipa:'/ˈtaɪfɔɪd/', vi:'bệnh thương hàn', ex:'Typhoid can spread through contaminated food and water.', c:'disease'},
  {w:'virus', p:'n', ipa:'/ˈvaɪrəs/', vi:'vi-rút', ex:'Some diseases are caused by viruses.', c:'disease'},
  {w:'immune system', p:'n phr', ipa:'/ɪˈmjuːn ˌsɪstəm/', vi:'hệ miễn dịch', ex:'HIV attacks the immune system.', c:'disease'},
  {w:'mosquito bite', p:'n phr', ipa:'/məˈskiːtəʊ baɪt/', vi:'vết muỗi đốt', ex:'Malaria can be transmitted through an infected mosquito bite.', c:'disease'},
  {w:'contaminated', p:'adj', ipa:'/kənˈtæmɪneɪtɪd/', vi:'bị nhiễm bẩn hoặc mầm bệnh', ex:'The disease spread through contaminated water.', c:'disease'},
  {w:'drug', p:'n', ipa:'/drʌɡ/', vi:'thuốc', ex:'A new malaria drug is being tested.', c:'disease'},
  {w:'injection', p:'n', ipa:'/ɪnˈdʒekʃən/', vi:'mũi tiêm, việc tiêm', ex:'The patient received an injection.', c:'disease'},
  {w:'diarrhoea', p:'n', ipa:'/ˌdaɪəˈrɪə/', vi:'bệnh tiêu chảy', ex:'Cholera can cause severe diarrhoea.', c:'disease'},
  {w:'infect', p:'v', ipa:'/ɪnˈfekt/', vi:'lây nhiễm', ex:'The virus can infect human cells.', c:'disease'},
  {w:'infected', p:'adj', ipa:'/ɪnˈfektɪd/', vi:'bị nhiễm bệnh', ex:'Infected water can spread disease.', c:'disease'}
];

/* =========================================================
   2. TRẠNG THÁI
   ========================================================= */
let list = DATA.slice();
let idx = 0;
let flipped = false;
let accent = 'en-US';

/* =========================================================
   3. TEXT-TO-SPEECH
   ========================================================= */
const synth = window.speechSynthesis;
let voices = [];

function loadVoices(){
  if (!synth) return;
  voices = synth.getVoices() || [];
  updateVoiceNote();
}
if (synth){
  loadVoices();
  synth.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 400); // vài trình duyệt nạp voices chậm
}

function pickVoice(lang){
  const target = lang.toLowerCase();
  const cands = voices.filter(v => (v.lang || '').replace('_','-').toLowerCase().startsWith(target));
  if (!cands.length) return null;
  const score = v => {
    const n = (v.name || '').toLowerCase();
    let s = 0;
    if (n.includes('google')) s += 10;          // Google voices – tự nhiên nhất
    if (n.includes('natural')) s += 9;          // Microsoft Natural (Edge)
    if (n.includes('neural')) s += 8;
    if (n.includes('microsoft')) s += 5;
    if (n.includes('samantha') || n.includes('daniel') || n.includes('alex') ||
        n.includes('kate') || n.includes('serena')) s += 4;
    if (v.localService) s += 1;
    return s;
  };
  return cands.sort((a,b) => score(b) - score(a))[0];
}

function updateVoiceNote(){
  const noteEl = document.getElementById('voiceNote');
  if (!synth){
    noteEl.textContent = '⚠️ Trình duyệt của bạn không hỗ trợ phát âm (Web Speech API). Hãy dùng Chrome, Edge hoặc Safari.';
    return;
  }
  const hasUS = !!pickVoice('en-US');
  const hasGB = !!pickVoice('en-GB');
  if (!hasUS && !hasGB){
    noteEl.textContent = '⚠️ Chưa tìm thấy giọng tiếng Anh. Hãy cài thêm gói giọng đọc trong phần cài đặt hệ điều hành.';
  } else if (!hasGB){
    noteEl.textContent = 'ℹ️ Máy chưa có giọng Anh–Anh (en-GB) — sẽ tạm dùng giọng tiếng Anh sẵn có.';
  } else if (!hasUS){
    noteEl.textContent = 'ℹ️ Máy chưa có giọng Anh–Mỹ (en-US) — sẽ tạm dùng giọng tiếng Anh sẵn có.';
  } else {
    noteEl.textContent = '✅ Đã tìm thấy giọng Anh–Mỹ và Anh–Anh trên thiết bị.';
  }
}

function speak(text, lang, btnEl){
  if (!synth) return;
  try { synth.cancel(); } catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.92;
  u.pitch = 1;
  u.volume = 1;
  const v = pickVoice(lang);
  if (v) u.voice = v;

  if (btnEl){
    btnEl.classList.add('playing');
    u.onend = () => btnEl.classList.remove('playing');
    u.onerror = () => btnEl.classList.remove('playing');
  }
  synth.speak(u);
}

/* =========================================================
   4. RENDER
   ========================================================= */
const cardEl   = document.getElementById('card');
const frontEl  = document.getElementById('front');
const backEl   = document.getElementById('back');
const fillEl   = document.getElementById('fill');
const counterEl= document.getElementById('counter');

const escAttr = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function render(){
  const it = list[idx];
  if (!it) return;

  const usOn = accent === 'en-US' ? ' on' : '';
  const gbOn = accent === 'en-GB' ? ' on' : '';

  frontEl.innerHTML = `
    <div class="badge">${CATS[it.c]}</div>
    <div class="word">${it.w}</div>
    <div class="meta">
      <span class="pos">${it.p}</span>
      <span class="ipa">${it.ipa}</span>
    </div>
    <div class="speak-row">
      <button class="speak${usOn}" data-say="${escAttr(it.w)}" data-lang="en-US">🇺🇸 US</button>
      <button class="speak${gbOn}" data-say="${escAttr(it.w)}" data-lang="en-GB">🇬🇧 UK</button>
    </div>
    <div class="flip-hint">Nhấn để xem nghĩa →</div>
  `;

  backEl.innerHTML = `
    <div class="badge">${CATS[it.c]}</div>
    <div class="word-sm">${it.w} <span class="ipa">${it.ipa}</span></div>
    <div class="meaning">${it.vi}</div>
    <div class="example">“${it.ex}”</div>
    <div class="speak-row">
      <button class="speak" data-say="${escAttr(it.ex)}" data-lang="en-US">🇺🇸 Nghe câu</button>
      <button class="speak" data-say="${escAttr(it.ex)}" data-lang="en-GB">🇬🇧 Nghe câu</button>
    </div>
    <div class="flip-hint">← Nhấn để quay lại</div>
  `;

  cardEl.classList.toggle('flipped', flipped);
  counterEl.textContent = `${idx + 1} / ${list.length}`;
  fillEl.style.width = ((idx + 1) / list.length * 100) + '%';

  if (document.getElementById('autoPlay').checked){
    speak(it.w, accent);
  }
}

function toggleFlip(){
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
}

function go(delta){
  if (!list.length) return;
  idx = (idx + delta + list.length) % list.length;
  flipped = false;
  render();
}

/* =========================================================
   5. SỰ KIỆN
   ========================================================= */
// Lật thẻ + phát âm (event delegation)
cardEl.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-say]');
  if (btn){
    speak(btn.dataset.say, btn.dataset.lang, btn);
    return;
  }
  toggleFlip();
});

// Điều hướng
document.getElementById('prevBtn').addEventListener('click', () => go(-1));
document.getElementById('nextBtn').addEventListener('click', () => go(1));
document.getElementById('flipBtn').addEventListener('click', toggleFlip);

// Xáo trộn
document.getElementById('shuffleBtn').addEventListener('click', () => {
  for (let i = list.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  idx = 0; flipped = false; render();
});

// Chọn giọng mặc định
document.getElementById('accentSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-accent]');
  if (!b) return;
  accent = b.dataset.accent;
  [...b.parentElement.children].forEach(x => x.classList.toggle('active', x === b));
  render();
});

// Chips lọc chủ đề
const chipsEl = document.getElementById('chips');
const chipDefs = [{ key:'all', label:'Tất cả' }].concat(
  Object.entries(CATS).map(([k, v]) => ({ key:k, label:v }))
);

chipDefs.forEach((def, i) => {
  const b = document.createElement('button');
  b.className = 'chip' + (i === 0 ? ' active' : '');
  const count = def.key === 'all' ? DATA.length : DATA.filter(x => x.c === def.key).length;
  b.textContent = `${def.label} (${count})`;
  b.dataset.cat = def.key;
  chipsEl.appendChild(b);
});

chipsEl.addEventListener('click', (e) => {
  const b = e.target.closest('.chip');
  if (!b) return;
  [...chipsEl.children].forEach(x => x.classList.toggle('active', x === b));
  list = b.dataset.cat === 'all' ? DATA.slice() : DATA.filter(x => x.c === b.dataset.cat);
  idx = 0; flipped = false; render();
});

// Bàn phím
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space'){ e.preventDefault(); toggleFlip(); }
  else if (e.code === 'ArrowRight'){ e.preventDefault(); go(1); }
  else if (e.code === 'ArrowLeft'){ e.preventDefault(); go(-1); }
  else if (e.key === '1'){ speak(list[idx].w, 'en-US'); }
  else if (e.key === '2'){ speak(list[idx].w, 'en-GB'); }
});

// Khởi động
render();
</script>
</body>
